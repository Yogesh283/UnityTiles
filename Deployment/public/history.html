<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>WXO Game History</title>
  <meta name="theme-color" content="#E31C23" />
  <link rel="icon" href="/assets/favicon.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --red: #E31C23; --ink: #111; --muted: #6B7280;
      --line: #ECEEF2; --bg: #FFF; --soft: #F7F8FA; --gold: #C99213;
      --ease: cubic-bezier(.22,1,.36,1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, sans-serif; background: #111; color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; border: 0; cursor: pointer; background: none; color: inherit; }

    .app {
      min-height: 100svh; max-width: 430px; margin: 0 auto; background: var(--bg);
      box-shadow: 0 0 0 1px #222, 0 30px 80px rgba(0,0,0,.5); padding-bottom: 96px;
    }
    @media (min-width: 900px) {
      body { background: #1a1a1c; padding: 24px 0; }
      .app { border-radius: 28px; overflow: hidden; }
    }

    .topbar {
      position: sticky; top: 0; z-index: 40;
      display: grid; grid-template-columns: 40px 1fr 40px; align-items: center;
      padding: 10px 14px; background: rgba(255,255,255,.96); backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
      font-size: 18px; background: var(--soft);
    }
    .topbar h1 {
      text-align: center; font-family: Montserrat, sans-serif; font-size: 16px; font-weight: 800;
    }

    .pad { padding: 14px; }

    .hero {
      background: linear-gradient(180deg, #FFF1F2 0%, #fff 75%);
      border: 1px solid #FECDD3; border-radius: 20px; padding: 16px; margin-bottom: 14px;
    }
    .hero .who {
      font-family: Montserrat, sans-serif; font-size: 18px; font-weight: 800;
    }
    .hero .sub { font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 4px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 14px; }
    .stat {
      background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 10px 8px; text-align: center;
    }
    .stat .num {
      font-family: Montserrat, sans-serif; font-size: 18px; font-weight: 800; color: var(--red);
    }
    .stat .lbl {
      font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
      color: var(--muted); margin-top: 4px;
    }

    .card {
      background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 6px 14px;
    }
    .row {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 0; border-bottom: 1px solid var(--line);
    }
    .row:last-child { border-bottom: 0; }
    .rank {
      width: 48px; height: 48px; border-radius: 14px; flex-shrink: 0;
      display: grid; place-items: center;
      font-family: Montserrat, sans-serif; font-weight: 800; font-size: 14px;
      background: var(--soft); color: var(--ink);
    }
    .rank.win { background: #ECFDF3; color: #15803D; }
    .rank.top3 { background: #FFF8E7; color: #B45309; }
    .body { flex: 1; min-width: 0; }
    .title { font-size: 14px; font-weight: 800; }
    .meta { font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 3px; }
    .prize { font-size: 13px; font-weight: 800; color: #B45309; white-space: nowrap; text-align: right; }
    .prize.none { color: var(--muted); font-weight: 600; }

    .empty, .error, .loading {
      text-align: center; padding: 28px 12px; color: var(--muted); font-weight: 600; font-size: 13px; line-height: 1.5;
    }
    .btn-red {
      display: inline-block; margin-top: 12px; background: var(--red); color: #fff;
      border-radius: 12px; padding: 12px 18px; font-weight: 800; font-size: 13px;
    }

    .bottom-nav {
      position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
      width: 100%; max-width: 430px; background: #fff; border-top: 1px solid var(--line);
      display: grid; grid-template-columns: repeat(5, 1fr);
      padding: 6px 4px calc(8px + env(safe-area-inset-bottom)); z-index: 50;
    }
    .bottom-nav a {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      font-size: 9px; font-weight: 600; color: #9CA3AF; padding: 4px;
    }
    .bottom-nav a.active { color: var(--red); }
    .bottom-nav .ico { font-size: 18px; }
    .bottom-nav .play-fab { /* flat; see wxo-bottom-nav.css */ }
  </style>
  <link rel="stylesheet" href="/assets/wxo-bottom-nav.css?v=3" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="icon-btn" href="/profile.html" aria-label="Back">←</a>
      <h1>Game History</h1>
      <a class="icon-btn" href="/wallet.html" aria-label="Wallet">👛</a>
    </header>

    <div class="pad">
      <section class="hero">
        <p class="who" id="who">Your matches</p>
        <p class="sub" id="sub">Login required — only your own results are shown.</p>
        <div class="stats">
          <div class="stat"><div class="num" id="statPlayed">0</div><div class="lbl">Played</div></div>
          <div class="stat"><div class="num" id="statWins">0</div><div class="lbl">Wins</div></div>
          <div class="stat"><div class="num" id="statPrize">0</div><div class="lbl">WXO won</div></div>
        </div>
      </section>

      <div class="card" id="list">
        <p class="loading">Loading your game history…</p>
      </div>
    </div>

        <nav class="bottom-nav" aria-label="Primary">
      <a href="/"><span class="ico">🏠</span>Home</a>
      <a href="/tournaments.html"><span class="ico">🏆</span>Tournament</a>
      <a href="/earn.html" aria-label="Reward"><img class="nav-logo" src="/assets/wxo-logo.png" alt="" />Reward</a>
      <a href="/wallet.html"><span class="ico">👛</span>Wallet</a>
      <a class="active" href="/profile.html"><span class="ico">👤</span>Profile</a>
    </nav>
  </div>

  <script src="/assets/wxo-auth.js?v=1"></script>
  <script>
    function ordinal(n) {
      n = Number(n) || 0;
      const v = Math.abs(n) % 100;
      if (v >= 11 && v <= 13) return n + 'th';
      if (n % 10 === 1) return n + 'st';
      if (n % 10 === 2) return n + 'nd';
      if (n % 10 === 3) return n + 'rd';
      return n + 'th';
    }
    function timeAgo(iso) {
      if (!iso) return '';
      const diff = Date.now() - new Date(iso).getTime();
      if (!Number.isFinite(diff) || diff < 0) return 'Just now';
      const mins = Math.floor(diff / 60000);
      if (mins < 60) return Math.max(1, mins) + 'm ago';
      const hours = Math.floor(mins / 60);
      if (hours < 24) return hours + 'h ago';
      return Math.floor(hours / 24) + 'd ago';
    }
    function escapeHtml(s) {
      return String(s || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    if (!WXOAuth.requireAuth()) {
      /* redirected to login */
    } else {
      const user = WXOAuth.getUser() || {};
      document.getElementById('who').textContent = (user.name || 'Player') + "'s history";
      document.getElementById('sub').textContent = user.email
        ? ('Signed in as ' + user.email)
        : 'Only this logged-in account’s matches.';

      WXOAuth.api('/tournaments/history').then(function (rows) {
        const list = Array.isArray(rows) ? rows : [];
        const wins = list.filter(function (r) { return Number(r.rank) === 1; }).length;
        const prize = list.reduce(function (sum, r) { return sum + (Number(r.prize) || 0); }, 0);
        document.getElementById('statPlayed').textContent = String(list.length);
        document.getElementById('statWins').textContent = String(wins);
        document.getElementById('statPrize').textContent = String(prize);

        const box = document.getElementById('list');
        if (!list.length) {
          box.innerHTML =
            '<div class="empty">No matches yet.<br/>Play IQ Match and your rank, score and prize will show up here.' +
            '<br/><a class="btn-red" href="/play.html?game=IQ%20Match">Play now</a></div>';
          return;
        }

        box.innerHTML = list.map(function (row) {
          const rank = Number(row.rank) || 0;
          const win = rank === 1;
          const top3 = rank > 1 && rank <= 3;
          const name = escapeHtml(row.tournament_name || row.tournament_id || 'Match');
          const when = timeAgo(row.created_at);
          const prizeTxt = Number(row.prize) > 0 ? ('+' + row.prize + ' WXO') : 'No prize';
          const players = row.max_players ? (row.max_players + 'P') : '';
          const entry = row.entry_fee != null ? (Number(row.entry_fee) > 0 ? (row.entry_fee + ' entry') : 'Free') : '';
          const bits = ['Score ' + (row.score || 0)];
          if (players) bits.push(players);
          if (entry) bits.push(entry);
          if (when) bits.push(when);
          return '<div class="row">' +
            '<div class="rank' + (win ? ' win' : top3 ? ' top3' : '') + '">' + ordinal(rank) + '</div>' +
            '<div class="body"><div class="title">' + (win ? 'Win · ' : '') + name + '</div>' +
            '<div class="meta">' + bits.join(' · ') + '</div></div>' +
            '<div class="prize' + (Number(row.prize) > 0 ? '' : ' none') + '">' + prizeTxt + '</div></div>';
        }).join('');
      }).catch(function (err) {
        document.getElementById('list').innerHTML =
          '<div class="error">' + escapeHtml(err && err.message ? err.message : 'Could not load history.') +
          '<br/><a class="btn-red" href="/history.html">Retry</a></div>';
      });
    }
  </script>
</body>
</html>
