<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>WXO Swap</title>
  <meta name="theme-color" content="#E31C23" />
  <link rel="icon" href="/assets/favicon.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --red: #E31C23; --ink: #111; --muted: #6B7280;
      --line: #ECEEF2; --bg: #FFF; --soft: #F7F8FA;
      --ease: cubic-bezier(.22,1,.36,1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, sans-serif; background: #111; color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; }
    button { border: 0; cursor: pointer; background: none; color: inherit; }

    .app {
      min-height: 100svh; max-width: 430px; margin: 0 auto; background: var(--bg);
      box-shadow: 0 0 0 1px #222, 0 30px 80px rgba(0,0,0,.5); padding-bottom: 92px;
    }
    @media (min-width: 900px) {
      body { background: #1a1a1c; padding: 24px 0; }
      .app { border-radius: 28px; overflow: hidden; }
    }

    .topbar {
      position: sticky; top: 0; z-index: 40;
      display: grid; grid-template-columns: 40px 1fr 40px; align-items: center;
      padding: 10px 14px; background: rgba(255,255,255,.96); backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
      font-size: 18px; background: var(--soft);
    }
    .topbar h1 {
      text-align: center; font-family: Montserrat, sans-serif; font-size: 16px; font-weight: 800;
    }

    .pad { padding: 14px; }

    .bal-chip {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--soft); border: 1px solid var(--line); border-radius: 14px;
      padding: 12px 14px; margin-bottom: 14px; font-size: 12px; font-weight: 600; color: var(--muted);
    }
    .bal-chip b { color: var(--ink); font-family: Montserrat, sans-serif; font-size: 14px; }

    .swap-card {
      background: #fff; border: 1px solid var(--line); border-radius: 20px;
      padding: 14px; box-shadow: 0 8px 28px rgba(0,0,0,.05); margin-bottom: 14px;
      position: relative;
    }
    .leg {
      background: var(--soft); border: 1.5px solid var(--line); border-radius: 16px;
      padding: 12px; margin-bottom: 8px;
    }
    .leg .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .leg .lbl { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .leg .avail { font-size: 11px; color: var(--muted); }
    .leg .avail button { color: var(--red); font-weight: 800; font-size: 11px; margin-left: 4px; }
    .leg .inputs { display: flex; gap: 8px; align-items: center; }
    .leg input {
      flex: 1; min-width: 0; border: 0; background: transparent; outline: none;
      font-family: Montserrat, sans-serif; font-size: 24px; font-weight: 800;
    }
    .leg select {
      border: 1px solid var(--line); background: #fff; border-radius: 12px;
      padding: 8px 10px; font-weight: 800; font-size: 13px; max-width: 110px;
    }

    .swap-mid {
      display: flex; justify-content: center; margin: -4px 0 4px; position: relative; z-index: 2;
    }
    .swap-mid button {
      width: 42px; height: 42px; border-radius: 50%; background: var(--red); color: #fff;
      font-size: 18px; font-weight: 800; box-shadow: 0 6px 16px rgba(227,28,35,.35);
      border: 3px solid #fff;
    }

    .rate-box {
      display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap;
      font-size: 12px; color: var(--muted); padding: 8px 2px 12px;
    }
    .rate-box strong { color: var(--ink); }

    .btn-red {
      width: 100%; background: var(--red); color: #fff; border-radius: 14px;
      padding: 14px; font-weight: 800; font-size: 15px;
      box-shadow: 0 8px 18px rgba(227,28,35,.3);
    }
    .btn-red:disabled { opacity: .5; cursor: not-allowed; }

    .note {
      background: #EFF6FF; border: 1px solid #BFDBFE; border-radius: 12px;
      padding: 10px 12px; font-size: 11px; color: #1E40AF; line-height: 1.45; margin-bottom: 14px;
    }

    .pairs {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px;
    }
    .pairs button {
      background: #fff; border: 1px solid var(--line); border-radius: 12px;
      padding: 10px; font-size: 11px; font-weight: 700; text-align: left;
    }
    .pairs button span { display: block; color: var(--muted); font-size: 10px; font-weight: 600; margin-top: 2px; }

    .history h3 {
      font-family: Montserrat, sans-serif; font-size: 13px; font-weight: 800;
      margin-bottom: 8px; text-transform: uppercase; letter-spacing: .04em;
    }
    .h-item {
      display: flex; justify-content: space-between; padding: 10px 0;
      border-bottom: 1px solid var(--line); font-size: 12px;
    }
    .h-item span { color: var(--muted); }

    .bottom-nav {
      position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
      width: 100%; max-width: 430px; background: #fff; border-top: 1px solid var(--line);
      display: grid; grid-template-columns: repeat(5, 1fr);
      padding: 6px 4px calc(8px + env(safe-area-inset-bottom)); z-index: 50;
    }
    .bottom-nav a {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      font-size: 9px; font-weight: 600; color: #9CA3AF; padding: 4px;
    }
    .bottom-nav a.active { color: var(--red); }
    .bottom-nav .ico { font-size: 18px; }
    .bottom-nav .play-fab {
      width: 52px; height: 52px; margin-top: -24px; border-radius: 50%;
      background: var(--red); color: #fff; display: grid; place-items: center;
      box-shadow: 0 8px 22px rgba(227,28,35,.45); font-size: 22px; border: 3px solid #fff;
    }

    .toast {
      position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%);
      background: #111; color: #fff; padding: 10px 16px; border-radius: 999px;
      font-size: 12px; font-weight: 700; z-index: 100; opacity: 0; pointer-events: none;
      transition: .25s var(--ease);
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="icon-btn" href="/wallet.html" aria-label="Back">←</a>
      <h1>Swap</h1>
      <a class="icon-btn" href="/wallet.html" aria-label="Wallet">👛</a>
    </header>

    <div class="pad">
      <div class="bal-chip">
        <span>WXO balance</span>
        <b id="balText">1,250 WXO</b>
      </div>

      <div class="note">
        Swap between <strong>WXO Coin</strong> and <strong>INR</strong> at platform rate.
        Current rate: <strong>1 WXO = ₹1</strong>.
      </div>

      <div class="swap-card">
        <div class="leg">
          <div class="row">
            <span class="lbl">From</span>
            <span class="avail">Avail <b id="fromAvail">—</b> <button type="button" id="btnMax">MAX</button></span>
          </div>
          <div class="inputs">
            <input id="fromAmt" type="number" min="0" step="1" placeholder="0" value="100" />
            <select id="fromAsset">
              <option value="WXO">WXO</option>
              <option value="INR">INR</option>
            </select>
          </div>
        </div>

        <div class="swap-mid">
          <button type="button" id="btnFlip" aria-label="Flip">⇅</button>
        </div>

        <div class="leg">
          <div class="row">
            <span class="lbl">To</span>
            <span class="avail">You receive</span>
          </div>
          <div class="inputs">
            <input id="toAmt" type="number" min="0" step="1" placeholder="0" readonly />
            <select id="toAsset">
              <option value="INR">INR</option>
              <option value="WXO">WXO</option>
            </select>
          </div>
        </div>

        <div class="rate-box">
          <span>Rate <strong id="rateText">1 WXO = ₹1</strong></span>
          <span>Fee <strong>0%</strong></span>
        </div>

        <button class="btn-red" type="button" id="btnSwap">Swap Now</button>
      </div>

      <div class="pairs">
        <button type="button" data-pair="WXO,INR">WXO → INR<span>Cash out value</span></button>
        <button type="button" data-pair="INR,WXO">INR → WXO<span>Buy coins</span></button>
      </div>

      <div class="history">
        <h3>Recent swaps</h3>
        <div id="hist"></div>
      </div>
    </div>

    <nav class="bottom-nav" aria-label="Primary">
      <a href="/"><span class="ico">🏠</span>Home</a>
      <a href="/tournaments.html"><span class="ico">🏆</span>Tournaments</a>
      <a href="/#referral" aria-label="Earn"><span class="play-fab">💰</span></a>
      <a href="/wallet.html"><span class="ico">👛</span>Wallet</a>
      <a href="/profile.html"><span class="ico">👤</span>Profile</a>
    </nav>
  </div>
  <div class="toast" id="toast"></div>

  <script src="/assets/wxo-auth.js?v=1"></script>
  <script src="/assets/wxo-wallet.js?v=7"></script>
  <script>
    const RATE = 1; // 1 WXO = 1 INR

    // Same wallet as every other page — swaps show up in Recent activity
    function getBal() {
      return WXOWallet.getBal();
    }
    function setBal(n) {
      WXOWallet.setBal(n);
      paintBal();
    }
    function getInr() {
      const n = Number(localStorage.getItem('wxo_inr_balance'));
      return Number.isFinite(n) ? n : 0;
    }
    function setInr(n) {
      localStorage.setItem('wxo_inr_balance', String(Math.max(0, Math.round(n * 100) / 100)));
    }

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => t.classList.remove('show'), 2000);
    }

    function paintBal() {
      document.getElementById('balText').textContent = getBal().toLocaleString('en-IN') + ' WXO';
      updateAvail();
      calc();
    }

    const fromAmt = document.getElementById('fromAmt');
    const toAmt = document.getElementById('toAmt');
    const fromAsset = document.getElementById('fromAsset');
    const toAsset = document.getElementById('toAsset');

    function updateAvail() {
      const a = fromAsset.value;
      const avail = a === 'WXO' ? getBal() : getInr();
      document.getElementById('fromAvail').textContent =
        avail.toLocaleString('en-IN') + (a === 'WXO' ? ' WXO' : ' ₹');
    }

    function syncPair() {
      if (fromAsset.value === toAsset.value) {
        toAsset.value = fromAsset.value === 'WXO' ? 'INR' : 'WXO';
      }
      updateAvail();
      calc();
    }

    function calc() {
      const amt = Math.max(0, Number(fromAmt.value) || 0);
      let out = 0;
      if (fromAsset.value === 'WXO' && toAsset.value === 'INR') out = amt * RATE;
      else if (fromAsset.value === 'INR' && toAsset.value === 'WXO') out = amt / RATE;
      else out = amt;
      toAmt.value = String(Math.round(out * 100) / 100);
      document.getElementById('rateText').textContent = '1 WXO = ₹' + RATE;
    }

    fromAmt.addEventListener('input', calc);
    fromAsset.addEventListener('change', syncPair);
    toAsset.addEventListener('change', syncPair);

    document.getElementById('btnFlip').onclick = () => {
      const fa = fromAsset.value, ta = toAsset.value, fv = fromAmt.value;
      fromAsset.value = ta; toAsset.value = fa;
      fromAmt.value = toAmt.value || fv;
      syncPair();
    };

    document.getElementById('btnMax').onclick = () => {
      const avail = fromAsset.value === 'WXO' ? getBal() : getInr();
      fromAmt.value = String(avail);
      calc();
    };

    document.querySelectorAll('[data-pair]').forEach(btn => {
      btn.addEventListener('click', () => {
        const [f, t] = btn.dataset.pair.split(',');
        fromAsset.value = f; toAsset.value = t;
        syncPair();
      });
    });

    document.getElementById('btnSwap').onclick = () => {
      if (window.WXOAuth && !WXOAuth.isLoggedIn()) {
        WXOWallet.showPopup({
          icon: '🔐',
          title: 'Login required',
          prize: null,
          message: 'Swapping moves real balance. Login to keep it linked to your WXO account.',
          okText: 'Login / Register',
          onOk: () => { location.href = '/login.html?next=' + encodeURIComponent('/swap.html'); }
        });
        return;
      }

      const amt = Math.floor(Number(fromAmt.value) || 0);
      if (amt <= 0) return toast('Enter amount');
      const from = fromAsset.value;
      const to = toAsset.value;
      if (from === to) return toast('Choose different assets');

      if (from === 'WXO' && to === 'INR') {
        if (amt > getBal()) return toast('Insufficient WXO');
        setBal(getBal() - amt);
        setInr(getInr() + amt * RATE);
        WXOWallet.addTx({ type: 'out', amount: amt, title: 'Swap to INR', note: '₹' + (amt * RATE) });
        addHist(amt + ' WXO → ₹' + (amt * RATE));
        toast('Swapped ' + amt + ' WXO → ₹' + (amt * RATE));
      } else if (from === 'INR' && to === 'WXO') {
        if (amt > getInr()) {
          WXOWallet.showPopup({
            lose: true,
            icon: '💳',
            title: 'Not enough INR',
            prize: null,
            message: 'Your INR balance only holds money you swapped out of WXO. To buy new coins, deposit from the wallet.',
            okText: 'Deposit Now',
            onOk: () => { location.href = '/wallet.html#deposit'; }
          });
          return;
        }
        setInr(getInr() - amt);
        setBal(getBal() + amt / RATE);
        WXOWallet.addTx({ type: 'in', amount: amt / RATE, title: 'Swap from INR', note: '₹' + amt });
        addHist('₹' + amt + ' → ' + (amt / RATE) + ' WXO');
        toast('Swapped ₹' + amt + ' → ' + (amt / RATE) + ' WXO');
      }
      fromAmt.value = '';
      calc();
    };

    const HIST_KEY = 'wxo_swap_hist_v1';

    function addHist(text) {
      let list = [];
      try { list = JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); } catch (e) {}
      list.unshift({ text: text, at: Date.now() });
      try { localStorage.setItem(HIST_KEY, JSON.stringify(list.slice(0, 20))); } catch (e) {}
      paintHist();
    }

    function paintHist() {
      const box = document.getElementById('hist');
      if (!box) return;
      let list = [];
      try { list = JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); } catch (e) {}
      if (!list.length) {
        box.innerHTML = '<div class="h-item"><div><b>No swaps yet</b></div><span>—</span></div>';
        return;
      }
      box.innerHTML = list.map(function (h) {
        const when = new Date(h.at).toLocaleString('en-IN', {
          hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short'
        });
        return '<div class="h-item"><div><b>' + h.text + '</b></div><span>' + when + '</span></div>';
      }).join('');
    }

    window.addEventListener('wxo:balance', paintBal);
    paintBal();
    paintHist();
  </script>
</body>
</html>
